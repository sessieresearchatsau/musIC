<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>musIC — sheet</title>
<!-- VexFlow 4.2.2 (Bravura build), vendored so the tool works offline. MIT. -->
<script src="/static/vendor/vexflow.js"></script>
<style>
:root{
  --bg:#efece6; --panel:#fff; --ink:#1b1a18; --dim:#6c6862; --line:#e2ded7;
  --accent:#a8331e; --accent-soft:#fbeae6; --mark:#f5d76e; --paper:#fffdf8;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);
  font:13px/1.5 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
header{display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap;
  padding:9px 14px;background:var(--panel);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20}
h1{font-size:14px;margin:0;font-weight:650;letter-spacing:.02em;white-space:nowrap}
nav{display:flex;gap:2px;background:#f3f1ec;border-radius:6px;padding:2px;
  max-width:100%;overflow-x:auto;scrollbar-width:none}
nav a{flex:none}
nav a{padding:3px 10px;border-radius:4px;color:var(--dim);text-decoration:none;font-size:12px}
nav a[aria-current=page]{background:var(--panel);color:var(--ink);
  box-shadow:0 1px 2px rgba(0,0,0,.08)}
nav a:hover{color:var(--accent)}
.tb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;
  padding-left:14px;border-left:1px solid var(--line)}
.fld{display:inline-flex;gap:5px;align-items:center;white-space:nowrap;
  color:var(--dim);font-size:12px}
.fld select{max-width:190px}
button,select{font:inherit;padding:5px 9px;border:1px solid var(--line);
  border-radius:5px;background:var(--panel);color:var(--ink)}
button,.btn{cursor:pointer}
.btn{display:inline-block;font:inherit;padding:5px 9px;border:1px solid var(--line);text-decoration:none;
  border-radius:5px;background:var(--panel);color:var(--ink)}
button:hover,.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.1);color:#fff}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,select:focus-visible,.btn:focus-within,a:focus-visible{
  outline:2px solid var(--accent);outline-offset:1px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap}
#status{flex:1 1 160px;text-align:right;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;color:var(--dim);font-size:11px}

main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;
  padding:22px 18px;align-items:start;max-width:1320px;margin:0 auto}
main>*{min-width:0}

/* the page: paper on a desk */
.paper{background:var(--paper);border-radius:2px;padding:44px 48px 36px;
  box-shadow:0 1px 3px rgba(0,0,0,.08),0 10px 30px rgba(0,0,0,.07);
  max-width:900px;margin:0 auto;width:100%}
.title{font:600 30px/1.2 var(--serif);text-align:center;margin:0}
.subtitle{font:italic 14px/1.4 var(--serif);text-align:center;color:var(--dim);
  margin:6px 0 0}
.marks{display:flex;justify-content:space-between;align-items:flex-end;
  font:14px var(--serif);margin:22px 0 2px;gap:12px}
.marks .tempo{font-weight:600}
.marks .key{color:var(--dim);font-style:italic}
#score{min-height:120px}
#score svg{display:block}
.folio{display:flex;justify-content:center;align-items:center;gap:12px;
  margin-top:20px;font:13px var(--serif);color:var(--dim)}
.empty{text-align:center;color:var(--dim);font:15px/1.6 var(--serif);padding:60px 10px}
.vf-note{cursor:pointer}
.hot path{fill:var(--accent)!important;stroke:var(--accent)!important}
.picked path{fill:#9a7400!important;stroke:#9a7400!important}

/* the set, beside the page */
aside{position:sticky;top:70px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;display:flex;flex-direction:column;max-height:calc(100vh - 92px);
  overflow:hidden}
aside h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);
  margin:0;padding:9px 12px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;gap:8px}
.readout{padding:7px 12px;border-bottom:1px solid var(--line);background:#fcfbf9;
  font-size:12px;color:var(--dim);min-height:34px}
.readout b{color:var(--ink)}
#bars{overflow:auto;padding:4px 0;flex:1 1 auto}
.bar{display:grid;grid-template-columns:44px 1fr;gap:6px;padding:5px 12px;
  border-bottom:1px solid #f3f1ec}
.bar:last-child{border-bottom:0}
.bar.hot{background:#fcf6f4}
.bar .num{font:italic 12px var(--serif);color:var(--dim);padding-top:2px}
.bar .rows{display:flex;flex-wrap:wrap;gap:3px}
.row{display:inline-flex;align-items:baseline;gap:3px;padding:1px 5px;border-radius:3px;
  cursor:pointer;white-space:nowrap;border:1px solid transparent;font-size:12px}
.row i{font-style:normal;font-size:9.5px;color:var(--dim)}
.row:hover,.row.hot{background:var(--accent-soft);border-color:var(--accent)}
.row.sel{background:var(--mark)}
.foot{border-top:1px solid var(--line);padding:9px 12px;display:flex;gap:6px;
  flex-wrap:wrap;align-items:center}
.foot .sub{color:var(--dim);font-size:11px;flex-basis:100%}

@media(max-width:1000px){
  main{grid-template-columns:1fr}
  aside{position:static;max-height:none}
  #bars{max-height:420px}
}
@media(max-width:760px){
  header{position:static;padding:8px 12px}
  .tb{padding-left:0;border-left:0}
  #status{flex-basis:100%;text-align:left}
  main{padding:10px 8px}
  .paper{padding:24px 10px 20px}
  .title{font-size:23px}
}
</style>
</head>
<body>
<header>
  <h1>musIC</h1>
  <nav><a id="toBench" href="/">Workbench</a><a href="/sheet" aria-current="page">Sheet</a><a href="/notebook">Notebook</a><a href="/concatenate">Concatenate</a></nav>
  <div class="tb">
    <label class="btn primary" for="file">Open MIDI…</label>
    <input type="file" id="file" class="vh" accept=".mid,.midi,audio/midi,audio/x-midi">
    <label class="btn" for="setfile">Open set…</label>
    <input type="file" id="setfile" class="vh" accept=".json,.set,.txt,application/json">
    <label class="fld">library <select id="library"></select></label>
  </div>
  <div class="tb">
    <label class="fld">track <select id="track"></select></label>
    <label class="fld">voice <select id="reduction">
      <option value="top">top line</option>
      <option value="voice0">lowest</option>
      <option value="full">all notes</option>
    </select></label>
    <label class="fld">encoding <select id="encoder"></select></label>
  </div>
  <div class="tb">
    <button id="play">▶ Play</button>
    <button id="stop" aria-label="Stop" title="Stop">■</button>
  </div>
  <span id="status"></span>
</header>

<main>
  <article class="paper">
    <h2 class="title" id="title">musIC</h2>
    <p class="subtitle" id="subtitle"></p>
    <div class="marks" id="marks" hidden>
      <span class="tempo" id="tempo"></span><span class="key" id="keyMark"></span>
    </div>
    <div id="score"><div class="empty">Pick a piece from the <b>library</b>, or open
      a MIDI or set file, to see it as a sheet.</div></div>
    <div class="folio" id="folio" hidden>
      <button id="prevPg" aria-label="Previous page">‹</button>
      <span id="pageNo"></span>
      <button id="nextPg" aria-label="Next page">›</button>
    </div>
  </article>

  <aside aria-label="Set">
    <h2><span id="setTitle">Set</span><span id="setMeta"></span></h2>
    <div class="readout" id="readout">Hover a note or a row to link them.</div>
    <div id="bars" class="mono"></div>
    <div class="foot">
      <button id="playSel" disabled>▶ Play selection</button>
      <button id="clearSel" disabled>Clear</button>
      <button id="copy">Copy set</button>
      <a class="btn" id="toNotebook" href="/notebook"
         title="Open this piece's set in a notebook of its own, a bar to a line">Open in Notebook</a>
      <span class="sub" id="selInfo">Click rows or noteheads to mark a subsequence.</span>
    </div>
  </aside>
</main>

<script src="/static/shared.js"></script>
<script src="/static/sheet.js"></script>
</body>
</html>
