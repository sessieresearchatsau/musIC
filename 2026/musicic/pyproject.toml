[project]
name = "musicic"
version = "0.1.0"
description = "Music <-> set workbench for Indexed Concatenation research"
requires-python = ">=3.11"
dependencies = [
    "mido>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "sympy>=1.12",
]

[project.scripts]
musicic = "musicic.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["musicic"]
